name: 'Deploy Hardcoded HTML to Pages'
description: 'Deploys the deploy_html folder directly to GitHub Pages'

runs:
  using: "composite"
  steps:
    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload HTML Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # ⚠️ MUST be a directory, not a specific file
        path: './.github/action/deploy_html'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
