<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Ajay Krishnaa M - Software Engineer Portfolio"
  >

  <title>
    Ajay Krishnaa M | Software Engineer
  </title>


  <!--
    Apply theme before page renders.
    Prevents light-theme flash in dark mode.
  -->
  <script>
    (() => {

      try {

        const savedTheme =
          localStorage.getItem(
            "portfolio-theme"
          );

        const prefersDark =
          window.matchMedia &&
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

        const theme =
          savedTheme ||
          (prefersDark ? "dark" : "light");

        document.documentElement
          .setAttribute(
            "data-theme",
            theme
          );

      }
      catch (error) {

        document.documentElement
          .setAttribute(
            "data-theme",
            "light"
          );

      }

    })();
  </script>


  <style>

    /* ==============================
       LIGHT THEME
    ============================== */

    :root {

      --bg: #f8fafc;

      --bg-secondary: #ffffff;

      --card: #ffffff;

      --text: #0f172a;

      --text-secondary: #64748b;

      --border: #e2e8f0;

      --primary: #2563eb;

      --primary-hover: #1d4ed8;

      --primary-soft: #eff6ff;

      --nav-bg:
        rgba(
          248,
          250,
          252,
          0.88
        );

      --shadow:
        0 10px 40px
        rgba(
          15,
          23,
          42,
          0.06

    /* ==============================
       DARK THEME
    ============================== */

    html[data-theme="dark"] {

      --bg: #0b1120;

      --bg-secondary: #111827;

    .profile-row span {

    }


    .profile-row strong {

    /* ==============================

    section {

    }


    .fact span {

    /* ==============================

    ============================== */

    .timeline {

    }


    .timeline::before {

        "";

      position:
        absolute;

        10px;

      bottom:
        10px;

      width:

      background:
        var(--border);

    }


    .timeline-item {

      display:
        grid;

      grid-template-columns:
        42px

      gap:
        25px;

      margin-bottom:
        25px;

    }


    .timeline-dot {

      width:
        13px;

      height:
        13px;

      background:
        var(--primary);

      border-radius:
        50%;

      margin-top:

      margin-left:
        14px;

        relative;

      z-index:
        2;

      box-shadow:
        0 0 0 6px
        var(--primary-soft);

    }


    .timeline-content {

      border:
        1px solid
        var(--border);

      background:
        var(--card);

      border-radius:
        18px;

      padding:
        28px;

      transition:
        0.2s ease;

    }


    .timeline-content:hover {

      border-color:
        var(--primary);

      transform:
        translateY(-2px);

    }


    .timeline-meta {

      color:
        var(--primary);

      font-size:
        13px;

      font-weight:
        700;

      margin-bottom:
        7px;

    }


    .timeline-content h3 {

      font-size:
        22px;

    }


    .timeline-content p {

      margin-top:
        8px;

      color:
        var(--text-secondary);

    }



    /* ==============================
       SKILLS
    ============================== */

    .skills-grid {

      margin-top:
        45px;

      display:
        grid;

      grid-template-columns:
        repeat(
          4,
          1fr
        );

      gap:
        15px;

    }


    .skill {

      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      padding:
        24px;

        130px;

        flex;

      flex-direction:
        column;

        space-between;

        0.2s ease;

    }


    .skill:hover {

      border-color:
        var(--primary);

      transform:
        translateY(-4px);

    }


    .skill-number {

      font-size:
        12px;

      color:
        var(--text-secondary);

    }


    .skill-name {

      font-size:
        18px;

      font-weight:
        700;

    }



    /* ==============================
       CERTIFICATIONS
    ============================== */

    .certifications {

      margin-top:
        45px;

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap:
        15px;

    }


    .certification {

      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        18px;

      padding:
        25px;

      transition:
        0.2s ease;

    }


    .certification:hover {

      transform:
        translateY(-4px);

      box-shadow:
        var(--shadow);

    }


    .cert-provider {

      color:
        var(--primary);

      font-size:
        12px;

      font-weight:
        700;

      text-transform:
        uppercase;

      letter-spacing:
        1px;

    }


    .certification h3 {

      font-size:
        17px;

      margin-top:
        12px;

    }


    .certification p {

      color:
        var(--text-secondary);

      font-size:
        13px;

      margin-top:
        15px;

    }



    /* ==============================
       CONTACT
    ============================== */

    .contact-card {

      background:
        var(--primary);

      color:
        #ffffff;

      border-radius:
        24px;

      padding:
        45px;

      display:
        grid;

      grid-template-columns:
        1.2fr
        0.8fr;

      gap:
        30px;

      align-items:
        center;

    }


    .contact-card h2 {

      font-size:
        clamp(
          32px,
          4vw,
          48px
        );

      line-height:
        1.1;

    }


    .contact-card p {

      margin-top:
        12px;

      color:
        rgba(
          255,
          255,
          255,
          0.82
        );

    }


    .contact-action {

      display:
        flex;

      justify-content:
        flex-end;

    }


    .contact-button {

      background:
        #ffffff;

      color:
        #111827;

      padding:
        13px 20px;

      border-radius:
        10px;

      font-weight:
        700;

      white-space:
        nowrap;

    }



    /* ==============================
       FOOTER
    ============================== */

    footer {

      border-top:
        1px solid
        var(--border);

      padding:
        30px 0;

      color:
        var(--text-secondary);

      font-size:
        13px;

    }


    .footer {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        20px;

    }



    /* ==============================
       REVEAL ANIMATION
    ============================== */

    .reveal {

      opacity:
        0;

      transform:
        translateY(20px);

      transition:
        opacity
        0.6s ease,
        transform
        0.6s ease;

    }


    .reveal.visible {

      opacity:
        1;

      transform:
        translateY(0);

    }



    /* ==============================
       RESPONSIVE
    ============================== */

    @media (
      max-width:
      900px
    ) {

      .hero-grid,
      .about-grid,
      .contact-card {

        grid-template-columns:
          1fr;

      }


      .skills-grid {

        grid-template-columns:
          repeat(
            2,
            1fr
          );

      }


      .certifications {

        grid-template-columns:
          repeat(
            2,
            1fr
          );

      }


      .contact-action {

        justify-content:
          flex-start;

      }

    }


    @media (
      max-width:
      650px
    ) {

      .container {

        width:
          min(
            100% - 28px,
            1120px
          );

      }


      .nav-container {

        min-height:
          64px;

      }


      .nav-links a:not(
        .linkedin-btn
      ) {

        display:
          none;

      }


      .nav-right {

        gap:
          8px;

      }


      .linkedin-btn {

        padding:
          9px 12px;

      }


      .hero {

        padding:
          80px 0
          60px;

      }


      .hero h1 {

        font-size:
          46px;

        letter-spacing:
          -2px;

      }


      .hero-description {

        font-size:
          16px;

      }


      section {

        padding:
          70px 0;

      }


      .skills-grid,
      .certifications {

        grid-template-columns:
          1fr;

      }


      .profile-row {

        align-items:
          flex-start;

      }


      .contact-card {

        padding:
          30px;

      }


      .footer {

        flex-direction:
          column;

      }

    }


    @media (
      prefers-reduced-motion:
      reduce
    ) {

      html {

        scroll-behavior:
          auto;

      }


      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        transition-duration:
          0.01ms !important;

      }

    }

  </style>

</head>
